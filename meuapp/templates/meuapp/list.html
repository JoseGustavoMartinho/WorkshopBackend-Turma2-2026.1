<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu app</title>
</head>
<body>
    <h1>Pessoas cadastradas</h1>

</body>
</html>
